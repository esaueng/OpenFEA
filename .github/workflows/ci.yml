name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      id-token: write
    uses: esaueng/OpenCAE/.github/workflows/trusted-ci.yml@4f118888f94ec9f67760473ad86b7b27b541df09

  test:
    name: test
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
