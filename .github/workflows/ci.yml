name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The audit is kept out of the required `checks / quality` path: a newly
  # published advisory for an existing dependency should not skip every PR's
  # checks. Dependency changes are still gated by `dependency-review`.
  checks:
    permissions:
      contents: read
    uses: esaueng/OpenFEA/.github/workflows/fleet-ci.yml@22150a7f76aff4875b74212504bae331ead2c0df # reviewed workflow (unreleased)

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:dependencies
